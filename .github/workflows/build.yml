name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: xcode-27
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: zsh Scripts/generate_project.zsh
      - name: Build iOS simulator app
        run: zsh Scripts/build_ios.zsh
      - name: Run iOS simulator tests
        run: zsh Scripts/test_ios.zsh
      - name: Build macOS app
        run: zsh Scripts/build_macos.zsh
      - name: Check Mac App Sandbox configuration
        run: zsh Scripts/check_macos_sandbox.zsh
