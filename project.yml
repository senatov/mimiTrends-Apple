name: mimiTrends-iOS
options:
  bundleIdPrefix: org.senatov
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  xcodeVersion: "27.0"
  projectFormat: xcode27_0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: org.senatov.mimitrends.apple
    DEVELOPMENT_TEAM: G2V9T9AD95
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MiMiTrends:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MiMiTrends/Sources
      - path: MiMiTrends/Resources
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: MiMiTrends
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Iakov Senatov
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": MiMiTrends/Configuration/MacAppStore.entitlements
  MiMiTrendsTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MiMiTrendsTests
    dependencies:
      - target: MiMiTrends
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        PRODUCT_BUNDLE_IDENTIFIER: org.senatov.mimitrends.apple.tests
schemes:
  mimiTrends-iOS:
    build:
      targets:
        MiMiTrends: all
        MiMiTrendsTests: [test]
    test:
      targets:
        - MiMiTrendsTests
