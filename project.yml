name: mimiTrends-iOS
options:
  bundleIdPrefix: org.senatov
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  xcodeVersion: "27.0"
  projectFormat: xcode27_0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: org.senatov.mimitrends.apple
    DEVELOPMENT_TEAM: G2V9T9AD95
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
targets:
  mimiTrends-iOS:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MiMiTrends/Sources
      - path: MiMiTrends/Resources
    settings:
      base:
        PRODUCT_NAME: mimiTrends-iOS
        PRODUCT_MODULE_NAME: MiMiTrends
        INFOPLIST_KEY_CFBundleName: mimiTrends-iOS
        INFOPLIST_KEY_CFBundleDisplayName: mimiTrends-iOS
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Iakov Senatov
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": MiMiTrends/Configuration/MacAppStore.entitlements
  mimiTrends-iOSTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MiMiTrendsTests
    dependencies:
      - target: mimiTrends-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        PRODUCT_BUNDLE_IDENTIFIER: org.senatov.mimitrends.apple.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/mimiTrends-iOS.app/mimiTrends-iOS"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/mimiTrends-iOS.app/Contents/MacOS/mimiTrends-iOS"
schemes:
  mimiTrends-iOS:
    build:
      targets:
        mimiTrends-iOS: all
        mimiTrends-iOSTests: [test]
    test:
      targets:
        - mimiTrends-iOSTests
