<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BDCFF"/>
      <stop offset="0.5" stop-color="#B7C0FF"/>
      <stop offset="1" stop-color="#E4C6FF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.1" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#B8FFE0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#B8FFE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="outline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FA6F0"/>
      <stop offset="1" stop-color="#8E7FE0"/>
    </linearGradient>
    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="270" y1="0" x2="760" y2="0">
      <stop offset="0" stop-color="#7CCBFF"/>
      <stop offset="0.5" stop-color="#9DB0FF"/>
      <stop offset="1" stop-color="#7DEBC2"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E4F1FF"/>
      <stop offset="1" stop-color="#B8D4FF"/>
    </radialGradient>
    <radialGradient id="nodeGreen" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#D5FFEC"/>
      <stop offset="1" stop-color="#8FEFC6"/>
    </radialGradient>
    <linearGradient id="candleUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6FFF4"/>
      <stop offset="1" stop-color="#6FE3B5"/>
    </linearGradient>
    <linearGradient id="candleDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEAF3"/>
      <stop offset="1" stop-color="#FFA9C8"/>
    </linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="shape"><rect x="6" y="6" width="1012" height="1012" rx="236"/></clipPath>
    <path id="spark" d="M0,-30 C3,-9 9,-3 30,0 C9,3 3,9 0,30 C-3,9 -9,3 -30,0 C-9,-3 -3,-9 0,-30 Z"/>
  </defs>

  <!-- icon body: everything is clipped to the squircle, corners stay transparent -->
  <g clip-path="url(#shape)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowA)"/>
    <rect width="1024" height="1024" fill="url(#glowB)"/>
    <circle cx="120" cy="930" r="170" fill="#FFFFFF" opacity="0.28" filter="url(#blur30)"/>
    <circle cx="930" cy="110" r="140" fill="#FFE6F6" opacity="0.5" filter="url(#blur30)"/>
    <!-- glossy top highlight -->
    <ellipse cx="480" cy="40" rx="560" ry="300" fill="#FFFFFF" opacity="0.34"/>
    <!-- soft bottom glow -->
    <ellipse cx="780" cy="1010" rx="460" ry="150" fill="#C9FFE8" opacity="0.4" filter="url(#blur14)"/>

    <!-- content -->
    <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
      <!-- candles -->
      <g opacity="0.25" filter="url(#blur14)" fill="#5A6FD0" transform="translate(0,14)">
        <rect x="358" y="690" width="64" height="76" rx="20"/>
        <rect x="480" y="650" width="64" height="120" rx="20"/>
        <rect x="602" y="682" width="64" height="76" rx="20"/>
      </g>
      <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.9">
        <line x1="390" y1="662" x2="390" y2="800"/>
        <line x1="512" y1="622" x2="512" y2="808"/>
        <line x1="634" y1="654" x2="634" y2="790"/>
      </g>
      <rect x="358" y="690" width="64" height="76" rx="20" fill="url(#candleDown)" stroke="#FFFFFF" stroke-width="6"/>
      <rect x="368" y="698" width="14" height="40" rx="7" fill="#FFFFFF" opacity="0.8"/>
      <rect x="480" y="650" width="64" height="120" rx="22" fill="url(#candleUp)" stroke="#FFFFFF" stroke-width="6"/>
      <rect x="490" y="660" width="14" height="64" rx="7" fill="#FFFFFF" opacity="0.85"/>
      <rect x="602" y="682" width="64" height="76" rx="20" fill="url(#candleDown)" stroke="#FFFFFF" stroke-width="6"/>
      <rect x="612" y="690" width="14" height="40" rx="7" fill="#FFFFFF" opacity="0.8"/>

      <!-- line chart -->
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="270,540 410,390 545,500 755,290" stroke="#5A6FD0" stroke-width="58" opacity="0.30" transform="translate(0,16)" filter="url(#blur14)"/>
        <polyline points="270,540 410,390 545,500 755,290" stroke="#7F95F2" stroke-opacity="0.6" stroke-width="58"/>
        <polyline points="270,540 410,390 545,500 755,290" stroke="url(#lineGrad)" stroke-width="42"/>
        <polyline points="270,540 410,390 545,500 755,290" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="10" transform="translate(-2,-10)"/>
      </g>

      <!-- nodes -->
      <g stroke="#7F95F2" stroke-width="8" stroke-opacity="0.7">
        <circle cx="270" cy="540" r="48" fill="url(#node)"/>
        <circle cx="410" cy="390" r="52" fill="url(#node)"/>
        <circle cx="545" cy="500" r="48" fill="url(#node)"/>
      </g>
      <g fill="#FFFFFF" opacity="0.95">
        <ellipse cx="254" cy="522" rx="14" ry="9" transform="rotate(-35 254 522)"/>
        <ellipse cx="393" cy="371" rx="15" ry="9" transform="rotate(-35 393 371)"/>
        <ellipse cx="529" cy="482" rx="14" ry="9" transform="rotate(-35 529 482)"/>
      </g>

      <!-- final node with face -->
      <circle cx="755" cy="290" r="92" fill="#7DEBC2" opacity="0.45" filter="url(#blur14)"/>
      <circle cx="755" cy="290" r="76" fill="url(#nodeGreen)" stroke="#52CFA2" stroke-width="8" stroke-opacity="0.8"/>
      <ellipse cx="728" cy="252" rx="22" ry="12" fill="#FFFFFF" opacity="0.95" transform="rotate(-35 728 252)"/>
      <ellipse cx="732" cy="294" rx="11" ry="16" fill="#35407A"/>
      <ellipse cx="778" cy="294" rx="11" ry="16" fill="#35407A"/>
      <circle cx="736" cy="288" r="5" fill="#FFFFFF"/>
      <circle cx="782" cy="288" r="5" fill="#FFFFFF"/>
      <circle cx="729" cy="300" r="2.5" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="775" cy="300" r="2.5" fill="#FFFFFF" opacity="0.9"/>
      <path d="M744 316 Q755 330 766 316" fill="none" stroke="#35407A" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="710" cy="316" rx="13" ry="8" fill="#FF9FC4" opacity="0.7"/>
      <ellipse cx="800" cy="316" rx="13" ry="8" fill="#FF9FC4" opacity="0.7"/>

      <!-- sparkles -->
      <g fill="#FFFFFF">
        <use href="#spark" transform="translate(255,300) scale(1.1)" opacity="0.95"/>
        <use href="#spark" transform="translate(862,480) scale(0.8)" opacity="0.9"/>
        <use href="#spark" transform="translate(600,215) scale(0.6)" opacity="0.85"/>
        <use href="#spark" transform="translate(282,730) scale(0.7)" opacity="0.85"/>
        <use href="#spark" transform="translate(850,640) scale(0.55)" opacity="0.8"/>
      </g>
    </g>

    <!-- inner thin rim line -->
    <rect x="44" y="44" width="936" height="936" rx="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
  </g>

  <!-- crisp rim: bright glass bevel + sharp outer contour line (drawn over the clip, on top) -->
  <rect x="20" y="20" width="984" height="984" rx="222" fill="none" stroke="url(#rim)" stroke-width="22"/>
  <rect x="6" y="6" width="1012" height="1012" rx="236" fill="none" stroke="url(#outline)" stroke-width="5" stroke-opacity="0.85"/>
</svg>
